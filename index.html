<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FreeGameHunter - Jogos Grátis Agora</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- OneSignal SDK v16 -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "f2ba2a7e-9634-43af-8489-7dcfa2c27cb4",
          allowLocalhostAsSecureOrigin: true,
          notifyButton: {
            enable: false,
          },
          promptOptions: {
            customlink: {
              enabled: true, /* Força a ativação do Custom Link via código */
              style: "button",
              size: "medium",
              color: {
                button: "#8b5cf6",
                text: "#ffffff",
              },
              text: {
                subscribe: "Ativar Notificações",
                unsubscribe: "Desativar Notificações",
                explanation: "Receba alertas de jogos grátis!",
              },
              unsubscribeEnabled: true,
            }
          }
        });
      });
    </script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              gaming: {
                900: '#0f172a',
                800: '#1e293b',
                700: '#334155',
                accent: '#8b5cf6',
                highlight: '#38bdf8'
              }
            },
            animation: {
              'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'fade-in': 'fadeIn 0.3s ease-out forwards',
              'scale-in': 'scaleIn 0.3s ease-out forwards',
              'spin-slow': 'spin 8s linear infinite',
              'swing': 'swing 2s ease-in-out infinite',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              scaleIn: {
                '0%': { transform: 'scale(0.95)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
              swing: {
                '0%, 100%': { transform: 'rotate(0deg)' },
                '20%': { transform: 'rotate(15deg)' },
                '40%': { transform: 'rotate(-10deg)' },
                '60%': { transform: 'rotate(5deg)' },
                '80%': { transform: 'rotate(-5deg)' },
              }
            }
          }
        }
      }
    </script>
    <style>
      body {
        background-color: #0f172a;
        color: #f8fafc;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1e293b; 
      }
      ::-webkit-scrollbar-thumb {
        background: #475569; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b; 
      }
      
      /* Estilização para garantir que o OneSignal injete o botão visível */
      .onesignal-customlink-container {
        width: 100% !important;
        min-height: 50px !important;
        display: flex !important;
        justify-content: center !important;
        align-items: center !important;
      }

      /* Caso o OneSignal injete um link/botão, garantimos que ele preencha o espaço e seja visível */
      .onesignal-customlink-container button, 
      .onesignal-customlink-container .onesignal-customlink-button {
        background-color: #8b5cf6 !important;
        color: white !important;
        padding: 12px 24px !important;
        border-radius: 12px !important;
        font-weight: bold !important;
        font-family: 'Inter', sans-serif !important;
        border: none !important;
        cursor: pointer !important;
        transition: all 0.2s ease !important;
        width: 100% !important;
        max-width: 280px !important;
      }

      .onesignal-customlink-container button:hover {
        background-color: #7c3aed !important;
        transform: translateY(-1px) !important;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "react/": "https://esm.sh/react@^19.2.3/",
        "@google/genai": "https://esm.sh/@google/genai@^1.33.0",
        "lucide-react": "https://esm.sh/lucide-react@^0.561.0"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
