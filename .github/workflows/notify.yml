gora coname: Free Game Notifier Bot

on:
  schedule:
    - cron: '0 * * * *' # Roda a cada 1 hora (no minuto 0)
  workflow_dispatch: # Permite que você rode manualmente clicando num botão no GitHub

jobs:
  check-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Run Notifier Script
        env:
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          ONESIGNAL_APP_ID: "f2ba2a7e-9634-43af-8489-7dcfa2c27cb4"
        run: node notify-bot.js
